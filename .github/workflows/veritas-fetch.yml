name: Veritas job postings
# Fetches the full text of the day's queued US tech job postings from the employers' own careers sites, for the
# Veritas Recruitment Agency videos (veritas/GUIDE.md). Runs when a queue file lands on the veritas-data branch and
# commits what it fetched back to that branch; nothing else is read or written.
on:
  push:
    branches: [veritas-data]
    paths: ["veritas/queue/*.json"]
permissions:
  contents: write
concurrency:
  group: veritas-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veritas-data
          fetch-depth: 2
      - name: Fetch the queued postings
        run: |
          set -e
          for q in $(git diff --name-only HEAD~1 HEAD -- 'veritas/queue/*.json' 2>/dev/null || ls veritas/queue/*.json); do
            [ -f "$q" ] && python3 veritas/fetch.py "$q"
          done
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veritas/fetched
          git diff --cached --quiet && exit 0
          git commit -m "Veritas: job postings fetched"
          for i in 1 2 3; do git push origin HEAD:veritas-data && exit 0; git pull --rebase origin veritas-data; done
          exit 1
