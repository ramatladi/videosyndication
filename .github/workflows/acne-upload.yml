name: Acne Medicine Johannesburg upload
# Uploads queued videos straight to the Acne Medicine Johannesburg YouTube channel (UCtwhnWNVzoS6MR0SkvZIDHQ) with
# the YouTube Data API. All logic is in acnemedicine/run_queue.sh, which processes EVERY queue item on acne-data
# (not just the last push), so multi-commit pushes or superseded runs cannot skip anything. The hourly run re-checks
# videos YouTube is still processing. Secrets: YT_ACNE_CLIENT_ID, YT_ACNE_CLIENT_SECRET, YT_ACNE_REFRESH_TOKEN.
on:
  push:
    branches: [acne-data]
    paths: ["acnemedicine/queue/*.json"]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acne-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/acne-data' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acne-data
          fetch-depth: 0
      - name: Process the queue
        env:
          YT_ACNE_CLIENT_ID: ${{ secrets.YT_ACNE_CLIENT_ID }}
          YT_ACNE_CLIENT_SECRET: ${{ secrets.YT_ACNE_CLIENT_SECRET }}
          YT_ACNE_REFRESH_TOKEN: ${{ secrets.YT_ACNE_REFRESH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d acnemedicine/queue ] || { echo "nothing queued"; exit 0; }
          bash acnemedicine/run_queue.sh
